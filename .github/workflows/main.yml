name: CI-CD Pipeline

#on:
#  push:
#    branches:
#      - main

  workflow_dispatch:
jobs:
  hello-job:
    runs-on: ubuntu-latest

    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/<ROLE_NAME>
          aws-region: <REGION>

      - name: Setup java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: login to ecr
        uses: docker/login-action@v3
        with:
          registry: 535002872949.dkr.ecr.ap-south-1.amazonaws.com

      - name: build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: 535002872949.dkr.ecr.ap-south-1.amazonaws.com/task-dashboard:${{ github.sha }}
          
      
